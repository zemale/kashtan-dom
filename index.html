<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каштановый дом</title>
<link rel="stylesheet" href="style.css?v=10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B0%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">

  </nav>
</div>
<div class="modal" id="modal" hidden>
  <div class="backdrop" data-close="1"></div>
  <div class="sheet" id="sheet"></div>
</div>
<script src="pets.js?v=10"></script>
<script src="app.js?v=10"></script>

</html>
